name: kord-dev
services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: kord
      POSTGRES_DB: kord
      POSTGRES_PASSWORD: local-development-only
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres_dev_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kord -d kord']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_dev_data:
